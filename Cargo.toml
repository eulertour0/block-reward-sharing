[package]
name = "block-reward-sharing"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
solana-commitment-config = "3.1"
solana-instruction = "~3.4"
solana-keypair = "3.1"
solana-message = "~4.4"
solana-pubkey = { version = "~4.2", features = ["curve25519"] }
solana-rpc-client = "=4.2.2"
solana-rpc-client-api = "=4.2.2"
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = { version = "~3.2", features = ["bincode"] }
solana-transaction = "~4.1"

[dev-dependencies]
sha2 = "0.10"
